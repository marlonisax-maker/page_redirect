<!DOCTYPE html>
<html>
<head>
  <meta name="referrer" content="no-referrer">
</head>
<body>
  <script>
    (function() {
      const a = document.createElement('a');
      a.href = 'https://www.youtube.com';
      a.rel = 'noreferrer noopener';
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.close();
    })();
  </script>
</body>
</html>
